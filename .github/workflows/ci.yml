name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: academy
          POSTGRES_PASSWORD: academy
          POSTGRES_DB: backend_academy_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U academy"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://academy:academy@localhost:5432/backend_academy_test
      JWT_ACCESS_SECRET: ci-only-secret-0123456789abcdef0123456789abcdef
      WEB_ORIGIN: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @academy/shared build
      - run: pnpm --filter @academy/api db:generate
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm --filter @academy/api db:deploy
      - run: pnpm test
      - run: pnpm build

  docker:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f apps/api/Dockerfile -t academy-api .
      - run: docker build -f apps/web/Dockerfile -t academy-web .
